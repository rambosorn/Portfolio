<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sql-cyl-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fa5c2"/>
      <stop offset="100%" stop-color="#3d829e"/>
    </linearGradient>
    <linearGradient id="sql-cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a84"/>
      <stop offset="50%" stop-color="#4692b1"/>
      <stop offset="100%" stop-color="#225368"/>
    </linearGradient>
    <linearGradient id="sql-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Database Stack -->
  <g transform="translate(6, 6)">
    <!-- Bottom layer -->
    <path d="M16 56 L16 84 C16 97 36 102 58 102 C80 102 100 97 100 84 L100 56 C100 68 80 74 58 74 C36 74 16 68 16 56 Z" fill="url(#sql-cyl-body)"/>
    <ellipse cx="58" cy="84" rx="42" ry="14" fill="#1b4556" opacity="0.4"/>

    <!-- Middle layer -->
    <path d="M16 36 L16 62 C16 74 36 80 58 80 C80 80 100 74 100 62 L100 36 C100 48 80 54 58 54 C36 54 16 48 16 36 Z" fill="url(#sql-cyl-body)"/>

    <!-- Top layer -->
    <path d="M16 16 L16 42 C16 54 36 60 58 60 C80 60 100 54 100 42 L100 16 Z" fill="url(#sql-cyl-body)"/>
    <ellipse cx="58" cy="18" rx="42" ry="14" fill="url(#sql-cyl-top)"/>

    <!-- SQL Badge Overlay -->
    <rect x="52" y="66" width="62" height="42" rx="14" fill="url(#sql-badge-grad)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="83" y="96" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="1px">SQL</text>
  </g>
</svg>